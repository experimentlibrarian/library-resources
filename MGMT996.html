<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort the information — MGMT996</title>
<meta name="description" content="MGMT996 Activity 1 for the classroom: place each source in a group, or bin it, and talk about why.">
<style>
:root{
  color-scheme:light;
  --ink:#14181F;
  --grey:#5A6472;

  --company:#C55A11;
  --other:#548235;
  --industry:#D4A017;
  --theory:#2E75B6;
  --bin:#7A8590;

  --chip:#C5E0B4;
  --chip-on:#A8CF8C;
  --src:#F8CBAD;
  --src-lite:#FBE5D6;
  --src-edge:#EFC3A2;

  --yes:#548235;
  --yes-bg:#E7F1DE;
  --no:#C55A11;
  --no-bg:#FBE5D6;

  --font:'Aptos','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#fff;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

.app{height:100%;display:flex;flex-direction:column;gap:clamp(8px,1.2vh,16px);padding:clamp(10px,1.6vh,20px) clamp(14px,1.8vw,30px)}

/* ---------- slim top row ---------- */
.top{flex:none;display:flex;align-items:center;gap:14px}
.srcno{font-size:clamp(.78rem,1.5vh,1rem);font-weight:700;color:var(--grey);letter-spacing:.04em;white-space:nowrap}
.pips{display:flex;gap:6px}
.pip{width:12px;height:12px;border-radius:50%;background:#E4E7EB;transition:background .3s,transform .3s}
.pip.done{background:var(--other)}
.pip.now{background:var(--ink);transform:scale(1.3)}
.sp{margin-left:auto;display:flex;gap:9px}
.ctx{flex:none;display:flex;gap:clamp(16px,2.4vw,44px);flex-wrap:wrap;align-items:flex-start;
  background:#F3F6F8;border:1px solid #E0E7EB;border-radius:12px;
  padding:clamp(11px,1.5vh,18px) clamp(16px,1.9vw,28px)}
.ctx > div{min-width:190px}
.ctx .prob{flex:1}
.ctx .k{display:block;font-size:clamp(.64rem,1.2vh,.84rem);font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
.ctx .v{display:block;font-size:clamp(.96rem,2vh,1.38rem);font-weight:700;line-height:1.3;color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:clamp(.78rem,1.5vh,1rem);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:clamp(7px,1.1vh,11px) clamp(14px,1.5vw,22px);cursor:pointer}
.btn:hover{background:#F2F4F6}
.btn.go{background:var(--ink);color:#fff}
.btn.go:hover{background:#2B323C}
.btn[disabled]{opacity:.3;cursor:default}
.btn:focus-visible{outline:4px solid var(--theory);outline-offset:3px}

/* ---------- stage ---------- */
.stage{flex:none;min-height:clamp(160px,26vh,260px);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.2vh,14px)}
.source{
  background:var(--src);border:2px solid var(--src-edge);border-radius:10px;
  padding:clamp(16px,2.6vh,30px) clamp(24px,3vw,50px);max-width:min(900px,66vw);text-align:center;
  font-size:clamp(1.25rem,3vh,2.3rem);font-weight:700;line-height:1.24;
  box-shadow:0 12px 30px rgba(20,24,31,.16);transform:rotate(-1.4deg);cursor:grab;touch-action:none;
  transition:transform .42s cubic-bezier(.4,0,.2,1),opacity .3s;
}
.source .lbl{display:block;font-size:clamp(.6rem,1.15vh,.8rem);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#A05A22;margin-bottom:clamp(8px,1.2vh,13px)}
.source.grab{cursor:grabbing;transition:none;box-shadow:0 24px 50px rgba(20,24,31,.25)}
.source.enter{animation:pop .36s cubic-bezier(.2,.9,.3,1)}
.source.nope{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.source.away{opacity:0;pointer-events:none}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95) rotate(-1.4deg)}to{opacity:1;transform:rotate(-1.4deg)}}
@keyframes shake{0%,100%{transform:rotate(-1.4deg)}18%{transform:translateX(-15px) rotate(-3.4deg)}46%{transform:translateX(13px) rotate(.8deg)}74%{transform:translateX(-6px) rotate(-2.2deg)}}

/* ---------- the bin ---------- */
.binbox{
  position:absolute;right:0;top:0;width:clamp(142px,12.5vw,200px);
  background:#fff;border:3px dashed var(--bin);border-radius:16px;cursor:pointer;
  padding:clamp(11px,1.6vh,18px) 10px clamp(10px,1.3vh,14px);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .22s cubic-bezier(.2,.9,.3,1),box-shadow .22s,border-color .2s,background .2s;
}
.binart{width:clamp(46px,6.4vh,78px);height:auto;overflow:visible;display:block}
.binart .lid{
  fill:#48525C;transform-box:view-box;transform-origin:9px 16px;
  transition:transform .3s cubic-bezier(.2,1.6,.4,1),fill .2s;
}
.binart .body{fill:#5E6973;transition:fill .2s}
.binart .ribs{stroke:#39424B;stroke-width:3;stroke-linecap:round;fill:none;opacity:.5;transition:stroke .2s}
.binbox .bl{font-size:clamp(1rem,2.1vh,1.55rem);font-weight:700;color:var(--bin);letter-spacing:.01em;transition:color .2s}

.binbox.hot{border-color:var(--no);background:var(--no-bg);transform:translateY(-7px) scale(1.07);box-shadow:0 20px 40px rgba(197,90,17,.3)}
.binbox.hot .binart .lid{transform:rotate(-28deg) translateY(-2px);fill:#9A4610}
.binbox.hot .binart .body{fill:#C55A11}
.binbox.hot .binart .ribs{stroke:#8A3E0C}
.binbox.hot .bl{color:var(--no)}

.binbox.tried{opacity:.32}
.binbox.win{border-style:solid;border-color:var(--yes);background:var(--yes-bg);animation:binwin .8s cubic-bezier(.2,.9,.3,1)}
.binbox.win .binart .lid{fill:#3C6B2B;transform:rotate(-14deg)}
.binbox.win .binart .body{fill:#548235}
.binbox.win .binart .ribs{stroke:#31581F}
.binbox.win .bl{color:var(--yes)}
@keyframes binwin{0%{transform:none}22%{transform:translateY(-12px) scale(1.09) rotate(-2deg)}44%{transform:translateY(0) scale(.96) rotate(1deg)}66%{transform:translateY(-5px) scale(1.03) rotate(-1deg)}100%{transform:none}}
.binbox:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.binslot{display:flex;flex-direction:column;gap:6px;width:100%;margin-top:3px}

/* ---------- feedback ---------- */
.fb{
  display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);
  border-radius:10px;padding:clamp(10px,1.6vh,18px) clamp(18px,2vw,30px);
  border:3px solid var(--no);background:var(--no-bg);max-width:min(1000px,72vw);
  animation:pop .26s ease;
}
.fb.yes{border-color:var(--yes);background:var(--yes-bg)}
.fb .mk{
  width:clamp(28px,3.4vh,40px);height:clamp(28px,3.4vh,40px);border-radius:50%;flex:none;
  display:grid;place-items:center;background:var(--no);color:#fff;
  font-size:clamp(.95rem,2vh,1.4rem);font-weight:700;
}
.fb.yes .mk{background:var(--yes)}
.fb p{margin:0;font-size:clamp(1rem,2.2vh,1.65rem);font-weight:700;line-height:1.3}
.fb .who{color:var(--no);margin-right:7px}
.fb.yes .who{color:var(--yes)}

/* ---------- the four groups ---------- */
.cols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.3vw,20px);min-height:0}
.col{
  background:#fff;border:3px solid var(--c);border-radius:10px;cursor:pointer;
  display:flex;flex-direction:column;min-height:0;
  transition:transform .18s,box-shadow .18s,opacity .18s;
}
.col .hd{margin:clamp(8px,1.1vh,13px) clamp(8px,.9vw,14px) 0}
.col .hd span{
  display:block;background:var(--chip);border-radius:7px;padding:clamp(7px,1.1vh,12px) 8px;
  text-align:center;font-size:clamp(.88rem,1.95vh,1.4rem);font-weight:700;line-height:1.15;color:#14181F;
  transition:background .2s;
}
.col .slot{flex:1;padding:clamp(8px,1.1vh,14px);display:flex;flex-direction:column;gap:clamp(7px,.9vh,11px);overflow:auto;min-height:0}
.c1{--c:var(--company)} .c2{--c:var(--other)} .c3{--c:var(--industry)} .c4{--c:var(--theory)}
.col.hot{transform:translateY(-6px);box-shadow:0 16px 34px rgba(20,24,31,.22)}
.col.hot .hd span{background:var(--chip-on)}
.col.tried{opacity:.38}
.col.win{animation:win .75s cubic-bezier(.2,.9,.3,1)}
.col.win .hd span{background:var(--chip-on)}
@keyframes win{0%{transform:none}28%{transform:translateY(-14px) scale(1.03)}58%{transform:translateY(0) scale(1)}80%{transform:translateY(-5px)}100%{transform:none}}
.col:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.placed{
  border:1px solid var(--src-edge);border-radius:8px;
  padding:clamp(8px,1.2vh,13px) clamp(9px,.8vw,14px);
  font-size:clamp(.78rem,1.6vh,1.12rem);font-weight:700;line-height:1.26;
  box-shadow:0 3px 9px rgba(20,24,31,.1);animation:land .34s cubic-bezier(.2,.9,.3,1);
}
.binslot .placed{font-size:clamp(.66rem,1.3vh,.88rem);padding:7px 9px}
@keyframes land{from{opacity:0;transform:scale(.82)}to{opacity:1}}
.hidden{display:none!important}

@media (max-width:900px){.cols{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">

  <div class="top">
    <div class="pips" id="pips" aria-hidden="true"></div>
    <div class="sp">
      <button class="btn" id="prev">&#8592; Back</button>
      <button class="btn go" id="next" disabled>Next source &#8594;</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>

  <div class="ctx">
    <div><span class="k">Client</span><span class="v">A road traffic management company</span></div>
    <div class="prob"><span class="k">The problem</span><span class="v">Judging safety risk on a worksite takes years to learn, and only three senior staff can do it. The company is growing and needs more people who can.</span></div>
  </div>

  <div class="stage">
    <div class="source" id="src"><span class="lbl" id="lbl">Source 1</span><span id="txt"></span></div>

    <div class="binbox" id="binbox" data-g="bin" tabindex="0" role="button" aria-label="Bin: not usable as evidence">
      <svg class="binart" viewBox="0 0 64 74" aria-hidden="true">
        <g class="lid">
          <rect x="26.5" y="3" width="11" height="8" rx="3.4"/>
          <rect x="5" y="11" width="54" height="10.5" rx="5.25"/>
        </g>
        <path class="body" d="M11.5 25.5h41l-4.1 40.6a6.2 6.2 0 0 1-6.2 5.6H21.8a6.2 6.2 0 0 1-6.2-5.6z"/>
        <g class="ribs"><path d="M24.5 35v24"/><path d="M32 35v24"/><path d="M39.5 35v24"/></g>
      </svg>
      <span class="bl">Bin</span>
      <div class="binslot" id="s-bin"></div>
    </div>

    <div class="fb hidden" id="fb" role="status" aria-live="polite">
      <span class="mk" id="mk">!</span>
      <p><span class="who" id="who"></span><span id="why"></span></p>
    </div>
  </div>

  <div class="cols" id="cols">
    <div class="col c1" data-g="company"  tabindex="0" role="button" aria-label="The company">
      <div class="hd"><span>The company</span></div><div class="slot" id="s-company"></div>
    </div>
    <div class="col c2" data-g="other"    tabindex="0" role="button" aria-label="Other organisations">
      <div class="hd"><span>Other organisations</span></div><div class="slot" id="s-other"></div>
    </div>
    <div class="col c3" data-g="industry" tabindex="0" role="button" aria-label="The industry">
      <div class="hd"><span>The industry</span></div><div class="slot" id="s-industry"></div>
    </div>
    <div class="col c4" data-g="theory"   tabindex="0" role="button" aria-label="Theory">
      <div class="hd"><span>Theory</span></div><div class="slot" id="s-theory"></div>
    </div>
  </div>

</div>

<script>
/* ===================================================================
   MGMT996 Activity 1 — the nine sources.
   Five places a source can go: company, other, industry, theory, bin.
   Reasons are short and never name the right group.
   =================================================================== */
var ACTIVITY = {
  groups:{
    company:{label:"The company"}, other:{label:"Other organisations"},
    industry:{label:"The industry"}, theory:{label:"Theory"}, bin:{label:"The bin"}
  },
  cards:[
  {text:"The company’s own strategy document on how it plans to grow",answer:"company",why:{
    company:"Written by your client. It shows how fast the gap is growing.",
    other:"This is your client, not somebody else.",
    industry:"One firm’s plan, not the whole sector.",
    theory:"A plan. It explains nothing.",
    bin:"Their own plan is evidence. Keep it."}},
  {text:"A journal article on why skilled people cannot explain how they do their job",answer:"theory",why:{
    theory:"Research on the problem itself: why the knowledge will not move.",
    company:"Researchers wrote it, not your client.",
    other:"An idea, not something an organisation did.",
    industry:"Nothing to do with road works. It applies anywhere.",
    bin:"This explains the whole problem. Keep it."}},
  {text:"A government code of practice with the national rules for road works",answer:"industry",why:{
    industry:"A regulator’s rules. They set the minimum competence for every firm.",
    company:"Written outside the company, not by it.",
    other:"Rules for everyone, not one organisation’s experience.",
    theory:"Rules say what must happen. They explain nothing.",
    bin:"Legally binding. You cannot ignore this."}},
  {text:"A hospital’s report on how it passed senior nurses’ judgement to new nurses",answer:"other",why:{
    other:"Another organisation, same problem. You can borrow the approach.",
    company:"A different organisation entirely.",
    industry:"Healthcare is not your client’s sector.",
    theory:"What someone did, not an idea.",
    bin:"A close parallel. Worth learning from."}},
  {text:"An internal job description from the company for a site supervisor",answer:"company",why:{
    company:"Your client’s own words on what a supervisor must be able to do.",
    other:"Your client wrote it.",
    industry:"One firm’s wording, not a sector standard.",
    theory:"It describes a role. It explains nothing.",
    bin:"Thin, but still the company’s own words."}},
  {text:"Statistics from Stats NZ on the ageing road and construction workforce",answer:"industry",why:{
    industry:"Official numbers for the whole sector. They show how urgent this is.",
    company:"National figures, not your client’s own staff.",
    other:"Numbers across the sector, not one organisation’s experience.",
    theory:"Data. It counts the problem, it does not explain it.",
    bin:"Official statistics. Hard evidence. Keep it."}},
  {text:"A book chapter with a model of how people become expert",answer:"theory",why:{
    theory:"A framework you can borrow to judge who is ready, and who is not.",
    company:"Published, not produced by your client.",
    other:"Sounds practical, but it is still an idea.",
    industry:"Not tied to any sector.",
    bin:"A published framework. Keep it."}},
  {text:"An airline’s own report on why its pilot mentoring scheme failed",answer:"other",why:{
    other:"Another organisation telling you what went wrong. More useful than a success.",
    company:"Another organisation’s report.",
    industry:"Aviation is not your client’s sector.",
    theory:"What happened once, not why it works.",
    bin:"A published failure. Unusually useful."}},
  {text:"A recruitment company blog: “Five ways to keep expert knowledge”",answer:"bin",why:{
    bin:"No author, no date, no evidence. It exists to sell a service.",
    company:"Not your client. A firm advertising to companies like them.",
    other:"Recruitment firms do publish real case studies. This is not one.",
    industry:"Not sector data. One firm advertising, with nothing behind it.",
    theory:"No research behind it. Just claims."}}
  ]
};
/* =================== end of source data =================== */

(function(){
  "use strict";
  var A=ACTIVITY, C=A.cards, $=function(id){return document.getElementById(id)};
  var src=$('src'), fb=$('fb'), binbox=$('binbox');
  var zones=[].slice.call(document.querySelectorAll('.col')).concat([binbox]);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i=0, settled=false, tried=[], placed=[];
  var tilt=[-2.4,1.8,-1.2,2.6,-3,1.1,-1.9,2.2,-1.5];
  var shade=['var(--src)','var(--src-lite)'];

  var pips=$('pips');
  C.forEach(function(){ var d=document.createElement('span'); d.className='pip'; pips.appendChild(d) });
  function paintPips(){
    [].slice.call(pips.children).forEach(function(d,n){
      d.className='pip'+(placed[n]?' done':'')+(n===i?' now':'');
    });
  }

  function show(){
    settled=false; tried=[];
    var c=C[i];
    $('lbl').textContent='Source '+(i+1);
    $('txt').textContent=c.text;
    src.classList.remove('away','nope','grab'); src.style.transform=''; src.style.opacity='';
    src.classList.remove('enter'); void src.offsetWidth; src.classList.add('enter');
    fb.classList.add('hidden');
    zones.forEach(function(k){k.classList.remove('tried','hot','win')});
    $('prev').disabled=(i===0);
    $('next').disabled=!placed[i];
    $('next').textContent=(i===C.length-1)?'Finish':'Next source →';
    paintPips();
    if(placed[i]){ settled=true; src.classList.add('away'); say('yes','',c.why[c.answer]); }
  }

  function say(kind, who, text){
    fb.classList.remove('hidden');
    fb.classList.toggle('yes', kind==='yes');
    $('mk').textContent = kind==='yes' ? '✓' : '✕';
    $('who').textContent = who ? who + ' —' : '';
    $('why').textContent = text;
  }

  function dock(g,n){
    var slot=$('s-'+g);
    if(slot.querySelector('[data-n="'+n+'"]')) return;
    var el=document.createElement('div');
    el.className='placed'; el.dataset.n=n;
    el.style.background=shade[n%2];
    el.style.transform='rotate('+tilt[n%tilt.length]+'deg)';
    el.textContent=C[n].text;
    slot.appendChild(el);
  }

  function place(g){
    var c=C[i];

    /* once settled, clicking anywhere else opens the discussion */
    if(settled){
      if(g===c.answer) say('yes','',c.why[g]);
      else say('no', A.groups[g].label, c.why[g]);
      return;
    }
    if(tried.indexOf(g)>-1) return;

    if(g===c.answer){
      settled=true; placed[i]=g;
      flyTo(g);
      var k=zones.filter(function(q){return q.dataset.g===g})[0];
      if(k){ k.classList.remove('tried'); k.classList.add('win') }
      say('yes','',c.why[g]);
      celebrate(g);
      $('next').disabled=false; paintPips();
      return;
    }

    tried.push(g);
    var kk=zones.filter(function(q){return q.dataset.g===g})[0];
    if(kk){kk.classList.add('tried');kk.classList.remove('hot')}
    src.style.transform='';
    src.classList.remove('enter'); void src.offsetWidth; src.classList.add('nope');
    say('no','',c.why[g]);
  }

  function flyTo(g){
    var n=i;
    if(reduce){ src.classList.add('away'); dock(g,n); return }
    var from=src.getBoundingClientRect(), to=$('s-'+g).getBoundingClientRect();
    var tw=to.width||160;
    var dx=(to.left+tw/2)-(from.left+from.width/2);
    var dy=(to.top+26)-(from.top+from.height/2);
    var sc=Math.min(.4, tw/Math.max(from.width,1));
    src.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+') rotate(0deg)';
    src.style.opacity='0';
    setTimeout(function(){ src.classList.add('away'); src.style.opacity=''; src.style.transform=''; dock(g,n) },420);
  }

  /* ---------- celebration ---------- */
  var cv=$('confetti'), cx=cv.getContext('2d'), bits=[], raf=null;
  function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0) }
  size(); addEventListener('resize',size);
  function celebrate(g){
    if(reduce) return;
    var host = (g==='bin') ? binbox : $('s-'+g);
    var r=host.getBoundingClientRect(), ox=r.left+r.width/2, oy=r.top+r.height/3;
    var pal=['#C55A11','#F8CBAD','#C5E0B4','#548235','#2E75B6','#D4A017','#FBE5D6'];
    for(var n=0;n<95;n++){
      var a=Math.random()*Math.PI*2, s=3+Math.random()*9;
      bits.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,g:.26+Math.random()*.16,
        w:5+Math.random()*7,h:6+Math.random()*9,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,
        c:pal[(Math.random()*pal.length)|0],life:0,max:72+Math.random()*45});
    }
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    bits=bits.filter(function(p){return p.life<p.max && p.y<innerHeight+60});
    bits.forEach(function(p){
      p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.992; p.rot+=p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.globalAlpha=Math.max(0,1-(p.life/p.max));
      cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    });
    if(bits.length) raf=requestAnimationFrame(tick); else { cx.clearRect(0,0,cv.width,cv.height); raf=null }
  }

  /* ---------- controls ---------- */
  zones.forEach(function(k){
    k.addEventListener('click',function(){place(k.dataset.g)});
    k.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();place(k.dataset.g)}});
  });
  $('next').onclick=function(){ if(i<C.length-1){ i++; show() } };
  $('prev').onclick=function(){ if(i>0){ i--; show() } };
  $('reset').onclick=function(){
    i=0; placed=[]; bits=[];
    zones.forEach(function(k){ $('s-'+k.dataset.g).innerHTML='' });
    show();
  };
  var order=['company','other','industry','theory','bin'];
  document.addEventListener('keydown',function(e){
    if(e.key>='1'&&e.key<='5'){e.preventDefault();place(order[+e.key-1]);return}
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key==='n'){e.preventDefault();$('next').click();return}
    if(e.key==='ArrowLeft'||e.key==='PageUp'||e.key==='p'){e.preventDefault();$('prev').click();return}
  });

  /* ---------- drag ---------- */
  var d=null;
  src.addEventListener('pointerdown',function(e){
    if(settled)return; d={x:e.clientX,y:e.clientY,m:false};
    src.setPointerCapture(e.pointerId);
    src.classList.remove('enter','nope'); src.classList.add('grab');
  });
  src.addEventListener('pointermove',function(e){
    if(!d)return;
    var dx=e.clientX-d.x, dy=e.clientY-d.y;
    if(Math.abs(dx)>5||Math.abs(dy)>5) d.m=true;
    src.style.transform='translate('+dx+'px,'+dy+'px) rotate(0deg)';
    var k=at(e.clientX,e.clientY);
    zones.forEach(function(q){q.classList.toggle('hot', q===k && !q.classList.contains('tried'))});
  });
  src.addEventListener('pointerup',function(e){
    if(!d)return;
    src.classList.remove('grab');
    var k=d.m?at(e.clientX,e.clientY):null; d=null;
    zones.forEach(function(q){q.classList.remove('hot')});
    if(k && !k.classList.contains('tried')) place(k.dataset.g);
    else src.style.transform='';
  });
  src.addEventListener('pointercancel',function(){
    if(!d)return; d=null; src.classList.remove('grab'); src.style.transform='';
    zones.forEach(function(q){q.classList.remove('hot')});
  });
  function at(x,y){
    for(var k=0;k<zones.length;k++){
      var r=zones[k].getBoundingClientRect();
      if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return zones[k];
    }
    return null;
  }

  show();
})();
</script>
</body>
</html>
